[project]
name = "linkedin-ai-jobs-applier-ultimate"
version = "0.1.0"
description = "LinkedIn Job Auto-Applier with AI-driven resume customization"
authors = [
    {name = "Alex", email = "beatwad@gmail.com"}
]
readme = "README.md"
requires-python = "==3.12.7"
dependencies = [
    "browser-use>=0.7.10",
    "httpx>=0.28.1",
    "inquirer==3.4.1",
    "jsonschema==4.23.0",
    "jsonschema-specifications==2023.12.1",
    "langchain==0.3.23",
    "langchain-anthropic",
    "langchain-community==0.3.14",
    "langchain-core==0.3.51",
    "langchain-google-genai",
    "langchain-ollama",
    "langchain-openai",
    "Levenshtein==0.27.1",
    "loguru==0.7.2",
    "playwright",
    "pydantic>=2.0.02",
    "PyYAML==6.0.2",
    "reportlab==4.2.2",
    "telethon==1.39.0",
    "pynput==1.8.1",
    "python-telegram-bot==21.9",
    "litellm>=1.80.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.26.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "black",
    "isort",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest==8.3.4",
    "pytest-asyncio==0.26.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "black",
    "isort",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
^/build/
^/dist/
^/\.eggs/
^/\.git/
^/\.hg/
^/\.mypy_cache/
^/\.nox/
^/\.tox/
^/\.venv/
^/venv/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [
    ".git",
    ".eggs",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".tox",
    ".venv",
    "venv",
    "build",
    "dist"]

[tool.pytest.ini_options]
testpaths = ["./tests/"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Support for class-based"]
